
<!DOCTYPE html>
<html>
<head>
    <title>Calculadora Vue</title>
</head>
<body>

    <div id="app">
        <h1>Calculadora</h1>

        <p>Numero 1: {{ numero1 }}</p>
        <p>Numero 2: {{ numero2 }}</p>

        <h2>Resultado: {{ numero1 + numero2 }}</h2>

        <h2>Resultado: {{ numero1 - numero2 }}</h2>
        
        <h2>Resultado: {{ numero1 * numero2 }}</h2>

        <h2>Resultado: {{ numero1 / numero2 }}</h2>

        <h2>Resultado: {{ numero1 ** numero2 }}</h2>

        <h2>Resultado: {{ Math.sqrt(numero1) }}</h2>
        
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="main.js"></script>

</body>
</html>
