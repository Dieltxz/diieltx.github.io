<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Turnos</title>

    <!-- <link rel="stylesheet" href="estilos.css"> -->

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Sistema de Turnos de Atención</h1>
            <p>Control de atención de alumnos</p>
        </header>

        <main class="container">
            <section class="panel">
                <h2>Escanear código QR</h2>
                <button class="btn-blue" @click="iniciarScanner">Activar cámara</button>
                <button class="btn-red" @click="detenerScanner">Detener cámara</button>
                <div id="reader"></div>
                <h3 v-if="mensaje">{{ mensaje }}</h3>
            </section>

            <section class="panel">
                <h2>Registrar alumno</h2>
                <input v-model="nuevo.nombre" @keyup.enter="agregarAlumno" placeholder="Nombre del alumno">
                <button class="btn-green" @click="agregarAlumno">Agregar alumno</button>
            </section>

            <section class="panel">
                <h2>Lista de alumnos</h2>
                <input v-model="buscar" placeholder="Buscar alumno" class="buscador">
                <div class="tabla-contenedor">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre del alumno</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="alumno in alumnosFiltrados" :key="alumno.id">
                                <td>{{ alumno.nombre }}</td>
                                <td>
                                    <span :class="alumno.atendido ? 'atendido' : 'pendiente'">
                                        {{ alumno.atendido ? 'Atendido' : 'Pendiente' }}
                                    </span>
                                </td>
                                <td>
                                    <button class="btn-blue" @click="generarQR(alumno)">Ver QR</button>
                                    <button v-if="!alumno.atendido" class="btn-green" @click="marcarAtendido(alumno)">Atender</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="panel qr-modal" v-if="alumnoQR">
                <h2>Código QR del alumno</h2>
                <h3>{{ alumnoQR.nombre }}</h3>
                <div id="codigoQR"></div>
                <button class="btn-gray" @click="alumnoQR = null">Cerrar</button>
            </section>
        </main>
    </div>

    <script src="mein.js"></script>
</body>
</html>
